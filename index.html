<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveFitRx | Prescriptive Fitness POC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .panel { display: none; }
        .panel.active { display: block; }
        .nav-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md mb-6">
        <div class="max-w-4xl mx-auto flex justify-around">
            <button onclick="switchTab('doctor')" class="nav-btn p-4 font-bold active">CLINICIAN PORTAL</button>
            <button onclick="switchTab('patient')" class="nav-btn p-4 font-bold">PATIENT PORTAL</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">

        <div id="doctor-panel" class="panel active">
            <div class="bg-white p-6 rounded-xl shadow-lg mb-6">
                <h2 class="text-xl font-bold mb-4 text-blue-800"><i class="fas fa-user-md mr-2"></i>Refer New Patient</h2>
                <form id="referral-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="name" placeholder="Patient Name" class="p-3 border rounded w-full" required>
                        <input type="email" name="email" placeholder="Email Address" class="p-3 border rounded w-full" required>
                    </div>
                    <select id="diagnosis-select" name="diagnosis" class="p-3 border rounded w-full bg-gray-50 font-semibold"></select>
                    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">Send Exercise Prescription</button>
                </form>
            </div>

            <h3 class="font-bold text-gray-700 mb-3 uppercase tracking-wider text-sm">Patient Oversight Dashboard</h3>
            <div id="patients-list" class="space-y-3">
                </div>
        </div>

        <div id="patient-panel" class="panel">
            <div id="patient-login-section" class="bg-white p-8 rounded-xl shadow-lg text-center">
                <div class="mb-6">
                    <i class="fas fa-envelope-open-text text-5xl text-blue-500 mb-4"></i>
                    <h2 class="text-2xl font-bold">Patient Access</h2>
                    <p class="text-gray-500">Enter your secure invitation code to begin</p>
                </div>
                <form id="patient-login-form" class="max-w-xs mx-auto space-y-4">
                    <input type="text" name="matrixId" placeholder="Invitation Code (e.g. MFRX-ST01)" class="p-4 border rounded-lg w-full text-center font-mono text-lg" required>
                    <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold">Access My Prescription</button>
                </form>
            </div>

            <div id="patient-dashboard" class="hidden">
                <div id="patient-dashboard-content">
                    </div>
            </div>
        </div>
    </main>

    <div id="clinician-notification-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl overflow-hidden">
            <div id="clinician-notification-content"></div>
            <div class="p-4 bg-gray-50 text-center">
                <button id="close-clinician-notification-btn" class="bg-blue-600 text-white px-8 py-2 rounded-full font-bold">Continue to Patient Hand-off</button>
            </div>
        </div>
    </div>

    <div id="patient-welcome-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full shadow-2xl p-8 border-t-8 border-blue-500">
            <div class="text-center">
                <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
                <h3 class="text-2xl font-bold mb-2">Prescription Received!</h3>
                <p class="text-gray-600 mb-6">Hello <span id="welcome-patient-name" class="font-bold"></span>, your corrective exercise regimen is ready.</p>
                <div class="bg-gray-100 p-4 rounded-lg mb-6">
                    <p class="text-xs text-gray-500 uppercase font-bold mb-1">Your Access Code</p>
                    <p id="welcome-matrix-id" class="text-3xl font-mono font-black text-blue-600"></p>
                </div>
                <button onclick="closePatientWelcomeModal()" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold">Got it! Open Dashboard</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=20260208"></script>
</body>
</html>
