<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveFitRx | Build 8.10 Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md flex justify-around sticky top-0 z-40">
        <button id="btn-doctor" onclick="switchTab('doctor')" class="nav-btn p-4 active uppercase text-sm font-bold">Clinician Portal</button>
        <button id="btn-patient" onclick="switchTab('patient')" class="nav-btn p-4 uppercase text-sm font-bold">Patient Portal</button>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div id="doctor-panel" class="panel active">
            <div class="bg-white p-8 rounded-2xl shadow-lg mb-8 border border-gray-100">
                <h2 class="text-2xl font-black mb-6 text-gray-800">Refer New Patient</h2>
                <form id="referral-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="name" placeholder="Patient Name" class="p-4 bg-gray-50 border rounded-xl w-full" required>
                        <input type="email" name="email" placeholder="Email Address" class="p-4 bg-gray-50 border rounded-xl w-full" required>
                    </div>
                    <select id="diagnosis-select" name="diagnosis" class="p-4 bg-gray-50 border rounded-xl w-full font-bold text-gray-700"></select>
                    <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">Issue Prescription</button>
                </form>
            </div>
            <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 px-2">Active Clinical Oversight (RWE)</h3>
            <div id="patients-list" class="space-y-4"></div>
        </div>

        <div id="patient-panel" class="panel">
            <div id="patient-login-section" class="bg-white p-10 rounded-3xl shadow-xl text-center max-w-md mx-auto">
                <h2 class="text-3xl font-black mb-4 text-gray-800">Secure Access</h2>
                <p class="text-gray-500 mb-8">Enter your Invitation Code to access your medical regimen.</p>
                <form id="login-form" class="space-y-4">
                    <input type="text" name="matrixId" placeholder="MFRX-XXXX" class="p-5 border-2 border-gray-100 rounded-2xl w-full text-center font-mono text-2xl tracking-widest focus:border-blue-500 outline-none" required>
                    <button type="submit" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-blue-700 transition">Access My Plan</button>
                </form>
            </div>
            <div id="patient-dashboard" class="hidden">
                <div id="patient-dashboard-content" class="max-w-md mx-auto"></div>
            </div>
        </div>
    </main>

    <div id="clinician-notification-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[2rem] max-w-sm w-full shadow-2xl overflow-hidden border border-white">
            <div id="clinician-notification-content" class="p-8 text-center"></div>
            <div class="p-6 bg-gray-50 border-t flex justify-center">
                <button id="close-clinician-notification-btn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg">Continue to Hand-off</button>
            </div>
        </div>
    </div>

    <div id="modal-welcome" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[2.5rem] max-w-md w-full shadow-2xl p-10 border-t-[10px] border-blue-600">
            <div class="text-center">
                <h3 class="text-3xl font-black text-gray-800 mb-4">Regimen Ready</h3>
                <p class="text-gray-600 mb-8 leading-relaxed">Hello <span id="welcome-name" class="font-bold text-gray-900 underline"></span>, your prescription has been finalized. Use this code to log in:</p>
                <div class="bg-gray-100 p-6 rounded-3xl mb-8 border-2 border-dashed border-gray-300">
                    <p id="show-id" class="text-4xl font-mono font-black text-blue-600"></p>
                </div>
                <button onclick="closeWelcome()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest shadow-xl">Got it! Open Dashboard</button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden relative border border-white/20">
            <button onclick="document.getElementById('payment-modal').classList.add('hidden')" class="absolute top-6 right-6 text-gray-300 hover:text-gray-600"><i class="fas fa-times-circle text-2xl"></i></button>
            <div id="payment-modal-content"></div>
        </div>
    </div>

    <script src="script.js?v=8.10_STABLE"></script>
</body>
</html>
