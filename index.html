<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveFitRx PoC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <button id="btn-doctor" onclick="switchTab('doctor')" class="active">Clinician</button>
        <button id="btn-patient" onclick="switchTab('patient')">Patient</button>
    </nav>

    <main>
        <div id="doctor-panel" class="panel active">
            <div class="card" style="border-left-color: #2563eb;">
                <h2 style="margin-top:0">Refer Patient</h2>
                <form id="referral-form">
                    <input type="text" id="ref-name" placeholder="Full Name" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;" required>
                    <select id="diagnosis-select" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;"></select>
                    <button type="submit" class="primary-btn">Issue Prescription</button>
                </form>
            </div>
            <div id="patients-list"></div>
        </div>

        <div id="patient-panel" class="panel">
            <div id="login-box" class="card" style="text-align:center">
                <h2>Secure Access</h2>
                <input type="text" id="matrix-input" placeholder="MFRX-XXXX" style="width:100%; padding:15px; text-align:center; font-family:monospace; font-size:24px; border:1px solid #ddd; border-radius:12px; margin-bottom:15px;">
                <button onclick="handleLogin()" class="primary-btn">Login</button>
            </div>
            <div id="patient-dash" style="display:none"></div>
        </div>
    </main>

    <div id="modal-welcome" class="modal">
        <div class="modal-content">
            <h2>Welcome to MoveFitRx</h2>
            <p>Your access code is: <strong id="show-id" style="color:#2563eb; font-size:24px"></strong></p>
            <button onclick="closeWelcome()" class="primary-btn">Enter Dashboard</button>
        </div>
    </div>

    <div id="modal-action" class="modal">
        <div class="modal-content" id="action-content"></div>
    </div>

    <script src="script.js?v=8.11"></script>
</body>
</html>
