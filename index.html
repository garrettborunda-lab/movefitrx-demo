<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveFitRx | Build 8.16 Restoration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">

    <nav class="bg-white shadow-md flex justify-around sticky top-0 z-50">
        <button id="btn-doctor" onclick="switchTab('doctor')" class="p-4 active uppercase text-xs font-bold">Clinician Portal</button>
        <button id="btn-patient" onclick="switchTab('patient')" class="p-4 uppercase text-xs font-bold">Patient Portal</button>
    </nav>

    <main class="max-w-xl mx-auto p-4">
        <div id="doctor-panel" class="panel active">
            <div class="card bg-white p-6 rounded-3xl shadow-lg mb-8">
                <h2 class="text-xl font-black mb-4">Refer Patient</h2>
                <form id="referral-form" class="space-y-3">
                    <input type="text" id="ref-name" name="name" placeholder="Full Name" class="w-full p-3 border rounded-xl" required>
                    <input type="email" id="ref-email" name="email" placeholder="Email Address" class="w-full p-3 border rounded-xl" required>
                    <select id="diagnosis-select" name="diagnosis" class="w-full p-3 border rounded-xl font-bold text-gray-600"></select>
                    <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold uppercase tracking-widest shadow-lg">Issue Prescription</button>
                </form>
            </div>
            <div id="patients-list" class="space-y-4"></div>
        </div>

        <div id="patient-panel" class="panel">
            <div id="patient-search-form" class="bg-white p-8 rounded-3xl shadow-lg text-center">
                <h2 class="text-2xl font-black mb-4">Secure Access</h2>
                <input type="text" id="matrix-id-input" placeholder="MFRX-ST01" class="w-full p-4 border rounded-2xl text-center font-mono text-xl mb-4 uppercase">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold">Access My Plan</button>
            </div>
            <div id="patient-data" class="hidden mt-6"></div>
        </div>
    </main>

    <div id="clinician-notification-modal" class="modal-overlay fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="modal-content bg-white p-8 rounded-3xl max-w-sm w-full text-center">
            <h3 class="text-xl font-black mb-4">Referral Generated</h3>
            <button onclick="window.closeClinicianNotificationModal()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">Continue to Hand-off</button>
        </div>
    </div>

    <div id="patient-welcome-modal" class="modal-overlay fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="modal-content bg-white p-8 rounded-[2.5rem] max-w-sm w-full text-center border-t-8 border-blue-600">
            <h2 class="text-2xl font-black mb-4">Invitation Received</h2>
            <button onclick="closePatientWelcomeModal()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold">Got it! Open Dashboard</button>
        </div>
    </div>

    <div id="payment-modal" class="modal-overlay fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-[60]">
        <div class="modal-content bg-white rounded-3xl max-w-md w-full overflow-hidden" id="payment-modal-content"></div>
    </div>

    <script src="script.js?v=8.16_STABLE"></script>
</body>
</html>
