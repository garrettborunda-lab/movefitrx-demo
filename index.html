<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveFitRx | Prescriptive Fitness POC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .panel { display: none; }
        .panel.active { display: block; }
        .nav-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .card { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <nav class="bg-white shadow-sm sticky top-0 z-40 mb-6">
        <div class="max-w-4xl mx-auto flex justify-around">
            <button onclick="switchTab('doctor')" class="nav-btn p-4 font-bold active uppercase tracking-wider text-sm transition-all">
                <i class="fas fa-user-md mr-2"></i>Clinician Portal
            </button>
            <button onclick="switchTab('patient')" class="nav-btn p-4 font-bold uppercase tracking-wider text-sm transition-all">
                <i class="fas fa-user mr-2"></i>Patient Portal
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">

        <div id="doctor-panel" class="panel active">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mb-8">
                <div class="flex items-center mb-6">
                    <div class="bg-blue-100 p-3 rounded-lg mr-4">
                        <i class="fas fa-file-prescription text-blue-600 text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-gray-800">Prescribe Exercise</h2>
                        <p class="text-gray-500 text-sm italic">Clinical corrective logic for medical fitness.</p>
                    </div>
                </div>
                
                <form id="referral-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="name" placeholder="Patient Full Name" class="p-4 bg-gray-50 border border-gray-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                        <input type="email" name="email" placeholder="Email Address" class="p-4 bg-gray-50 border border-gray-200 rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                    </div>
                    <select id="diagnosis-select" name="diagnosis" class="p-4 bg-gray-50 border border-gray-200 rounded-xl w-full font-semibold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </select>
                    <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black uppercase tracking-widest shadow-lg hover:bg-blue-700 transform hover:-translate-y-0.5 active:translate-y-0 transition-all">
                        Generate & Send Prescription
                    </button>
                </form>
            </div>

            <h3 class="font-black text-gray-400 mb-4 uppercase tracking-[0.2em] text-xs px-2 flex justify-between">
                <span>Active Oversight</span>
                <span class="text-blue-500">Real-Time Evidence (RWE)</span>
            </h3>
            <div id="patients-list" class="space-y-4 px-1">
                </div>
        </div>

        <div id="patient-panel" class="panel">
            <div id="patient-login-section" class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-md mx-auto border border-gray-50">
                <div class="mb-8">
                    <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-lock text-3xl"></i>
                    </div>
                    <h2 class="text-3xl font-black text-gray-800 mb-2">Patient Access</h2>
                    <p class="text-gray-500 px-4">Enter the Invitation Code provided by your clinician to view your prescription.</p>
                </div>
                <form id="patient-login-form" class="space-y-5">
                    <input type="text" name="matrixId" placeholder="MFRX-XXXX" class="p-5 border-2 border-gray-100 rounded-2xl w-full text-center font-mono text-2xl tracking-widest focus:border-blue-500 outline-none uppercase" required>
                    <button type="submit" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-blue-700 transition">
                        Access My Plan
                    </button>
                </form>
            </div>

            <div id="patient-dashboard" class="hidden">
                <div id="patient-dashboard-content">
                    </div>
            </div>
